<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f5f0df, #e5e5e5);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #96720c;
            margin-bottom: 25px;
        }

        .add-btn {
            display: inline-block;
            background: #b58a16;
            color: white;
            padding: 12px 20px;
            border-radius: 7px;
            text-decoration: none;
            margin-bottom: 25px;
        }

        .add-btn:hover {
            background: #92700e;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            width: 300px;
            background: white;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
            display: block;
            margin-bottom: 15px;
        }

        .card h2 {
            color: #96720c;
            font-size: 21px;
            margin-bottom: 15px;
        }

        .card p {
            color: #555;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .view-btn {
            display: inline-block;
            background: #b58a16;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 5px;
        }

        .view-btn:hover {
            background: #92700e;
        }

        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
        }

        .delete-btn:hover {
            background: #b02a37;
        }
    </style>
</head>

<body>

    <h1>Student Management System</h1>

    <a href="/students/add" class="add-btn">+ Add Student</a>

    <div class="container">

        {% for std in stds %}

        <div class="card">

            <img src="{{ std[6] }}" alt="Student Image">

            <h2>Name: {{ std[1] }}</h2>

            <p>Age: {{ std[2] }}</p>
            <p>Gender: {{ std[3] }}</p>
            <p>Marks: {{ std[4] }}</p>
            <p>Course: {{ std[5] }}</p>

            <a href="/students/{{ std[0] }}" class="view-btn">
                View Details
            </a>
            <a href="/students/edit/{{std[0]}}" class="view-btn">
                Update
            </a>


            <form action="/std/delete/{{ std[0] }}" method="POST">
                <button type="submit" class="delete-btn">DELETE</button>
            </form>

        </div>

        {% endfor %}

    </div>

</body>
</html>
